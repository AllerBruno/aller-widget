<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aller Studio — Quote Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Orion — quote assistant (Figma 5297:69557): dark chat, silhouette video on the left, lime glows */
  :root{
    --lime:#D5FE00;
    --lime-border:#D8FE11;
    --dark:#121212;
    --bg:#1C1C1C;
    --body:#70808F;
    --surface:#F9FAFB;
    --glass:rgba(255,255,255,.04);
    --glass-border:rgba(255,255,255,.06);
    --muted:rgba(255,255,255,.56);
    --danger:#FF5C5C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',Helvetica,Arial,sans-serif;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
  }

  /* ── Widget shell ─────────────────────────────── */
  .widget{
    position:relative;
    width:100%;max-width:1208px;height:100%;max-height:802px;
    background:var(--bg);
    border-radius:32px;
    overflow:hidden;
    display:grid;grid-template-columns:330px 1fr;
  }

  /* left: silhouette video over a white → lime → black gradient */
  .side{
    position:relative;overflow:hidden;
    background:linear-gradient(to top,#121212 0%,var(--lime) 50%,var(--surface) 100%);
  }
  .side video{
    position:absolute;top:50%;left:50%;height:100%;width:auto;min-width:100%;
    transform:translate(calc(-50% + 10px),-50%);
    object-fit:cover;mix-blend-mode:darken;
  }

  /* right: the chat */
  .main{position:relative;isolation:isolate;display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .glow{position:absolute;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(48px)}
  .glow.top{
    left:50%;top:-230px;width:720px;height:420px;transform:translateX(-50%);
    background:radial-gradient(closest-side,rgba(255,255,230,.95) 0%,rgba(234,255,128,.55) 35%,rgba(150,170,20,.28) 65%,transparent 100%);
  }
  .glow.bottom{
    left:50%;bottom:-260px;width:780px;height:520px;transform:translateX(-45%);
    background:radial-gradient(closest-side,rgba(190,220,20,.42) 0%,rgba(120,140,10,.22) 55%,transparent 100%);
  }

  /* progress bar */
  .progress{position:absolute;top:0;left:0;right:0;height:8px;background:var(--dark);z-index:5}
  .progress .fill{height:100%;width:0;background:var(--lime);border-radius:0 8px 8px 0;transition:width .4s ease}

  /* header */
  .header{
    flex:0 0 auto;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:40px 24px 8px;text-align:center;
  }
  .brand-name{font-family:'Rajdhani',Arial,sans-serif;font-weight:700;font-size:24px;line-height:24px;color:#fff}
  .brand-sub{font-size:12px;line-height:18px;font-weight:500;color:#fff}

  /* logo */
  .logo{
    position:relative;flex:0 0 auto;
    background:radial-gradient(140% 140% at 0% 0%,#FFFFFF 0%,#F5FFBF 25%,#EAFF80 50%,#E0FE40 75%,#D5FE00 100%);
    border-radius:24%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 1px 1px 2px rgba(255,255,255,.7),inset -1px -2px 3px rgba(18,18,18,.18),0 1px 2px rgba(18,18,18,.18);
  }
  .logo .bar{
    width:48%;height:21%;background:var(--dark);border-radius:999px;
    box-shadow:inset .6px .6px .6px rgba(255,255,255,.4),inset -.6px -.6px .6px rgba(18,18,18,.35),
               .4px .6px .6px rgba(18,18,18,.25);
  }
  .logo.lg{width:64px;height:64px}

  /* ── Chat area ────────────────────────────────── */
  .chat{
    flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
    padding:24px 24px 16px;
    display:flex;flex-direction:column;gap:16px;
    scroll-behavior:smooth;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 24px);
            mask-image:linear-gradient(to bottom,transparent 0,#000 24px);
  }
  .chat::-webkit-scrollbar{width:6px}
  .chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}

  .row{display:flex;gap:8px;align-items:flex-start;animation:rise .35s ease both}
  .row.user{justify-content:flex-end}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .avatar{width:32px;height:32px;border-radius:50%;flex:0 0 auto;margin-top:20px;object-fit:cover}
  .msg{display:flex;flex-direction:column;gap:4px;max-width:min(377px,72%);min-width:0}
  .row.user .msg{align-items:flex-end;max-width:min(377px,80%)}
  .time{font-size:10px;line-height:16px;font-weight:500;color:#fff;opacity:.32;padding:0 4px}

  .bubble{
    background:var(--glass);border:1px solid var(--glass-border);
    -webkit-backdrop-filter:blur(32px);backdrop-filter:blur(32px);
    border-radius:16px;padding:12px;
    font-size:12px;line-height:18px;font-weight:500;color:#fff;
    word-break:break-word;
  }

  /* "Thinking" indicator (centred, under the last message) */
  .thinking{
    align-self:center;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:16px 0 4px;animation:rise .3s ease both;
  }
  .thinking .dot{width:5px;height:5px;border-radius:50%;background:var(--lime-border);box-shadow:0 0 8px rgba(216,254,17,.6);animation:pulse 1.4s ease-in-out infinite}
  .thinking .label{font-family:'Rajdhani',Arial,sans-serif;font-weight:600;font-size:16px;line-height:18px;color:#fff;margin-top:8px}
  .thinking .wave{display:flex;gap:4px;height:16px}
  .thinking .wave i{width:4px;height:4px;margin-top:6px;border-radius:50%;background:#fff;animation:wave 1.2s ease-in-out infinite}
  .thinking .wave i:nth-child(2){animation-delay:.15s}
  .thinking .wave i:nth-child(3){animation-delay:.3s}
  @keyframes wave{0%,100%{transform:translateY(-4px);opacity:.5}50%{transform:translateY(4px);opacity:1}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* quick-reply tags */
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-left:40px;animation:rise .35s ease both}
  .tag{
    border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:8px 12px;
    font-family:'Inter',sans-serif;font-size:12px;line-height:16px;font-weight:500;color:#fff;
    background:rgba(255,255,255,.06);
    cursor:pointer;transition:transform .12s ease,background .15s ease,color .15s ease;
    user-select:none;
  }
  .tag:hover{transform:translateY(-1px);background:rgba(255,255,255,.12)}
  .tag:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
  .tag.selected{background:var(--lime);border-color:var(--lime);color:var(--dark)}
  .tag.confirm{background:#fff;border-color:#fff;color:var(--dark)}

  /* ── Project brief card ───────────────────────── */
  .brief{
    margin-left:40px;
    border:1px solid var(--glass-border);border-radius:16px;
    background:var(--glass);-webkit-backdrop-filter:blur(32px);backdrop-filter:blur(32px);
    padding:16px;
    display:flex;flex-direction:column;gap:20px;
    animation:rise .4s ease both;
  }
  .brief h3{font-family:'Rajdhani',Arial,sans-serif;font-weight:700;font-size:24px;line-height:24px;color:#fff}
  .brief .rows{display:flex;flex-direction:column;gap:12px}
  .brief .r{
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.08);
    font-size:12px;line-height:18px;
  }
  .brief .r .k{color:var(--muted);font-weight:500}
  .brief .r .v{color:#fff;font-weight:600;text-align:right;word-break:break-word}
  .brief .verdict{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .badge{
    border-radius:16px;padding:8px 12px;
    font-size:12px;line-height:16px;font-weight:500;color:var(--dark);
    background:var(--lime);
  }
  .badge.no{background:rgba(255,255,255,.08);color:#fff}
  .price{font-family:'Rajdhani',Arial,sans-serif;font-weight:700;font-size:32px;line-height:32px;color:#fff}

  /* final actions: book a call / WhatsApp */
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:40px;animation:rise .35s ease both}
  .cta{
    display:inline-flex;align-items:center;gap:8px;
    border-radius:16px;padding:14px 20px;
    font-family:'Rajdhani',Arial,sans-serif;font-weight:700;font-size:16px;line-height:20px;letter-spacing:.3px;
    text-decoration:none;cursor:pointer;border:1px solid transparent;
    transition:transform .12s ease,box-shadow .15s ease,background .15s ease;
  }
  .cta:hover{transform:translateY(-1px)}
  .cta:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .cta svg{width:18px;height:18px;flex:0 0 auto}
  .cta.primary{background:var(--lime);color:var(--dark);box-shadow:0 0 32px rgba(216,254,17,.2)}
  .cta.primary:hover{box-shadow:0 0 40px rgba(216,254,17,.35)}
  .cta.ghost{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#fff}
  .cta.ghost:hover{background:rgba(255,255,255,.12)}

  /* ── Cal.com slide-over panel (covers the chat, own scroll context) ── */
  .cal-overlay{
    position:absolute;inset:0;z-index:50;
    background:#fff;
    display:flex;flex-direction:column;
    transform:translateX(100%);
    transition:transform .35s ease;
  }
  .cal-overlay.open{transform:translateX(0)}
  .cal-overlay-head{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:20px 20px 14px;background:var(--bg);
  }
  .cal-back{
    width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.08);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;color:#fff;
    transition:transform .12s ease, background .12s ease;
  }
  .cal-back:hover{background:rgba(255,255,255,.16)}
  .cal-back:active{transform:scale(.92)}
  .cal-back:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
  .cal-overlay-head h4{flex:1;font-family:'Rajdhani',Arial,sans-serif;font-weight:700;font-size:18px;color:#fff}
  .cal-overlay-head a{font-size:12px;font-weight:500;color:var(--muted);text-decoration:none;white-space:nowrap}
  .cal-overlay-head a:hover{color:#fff}
  .cal-overlay-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

  /* ── Input card ───────────────────────────────── */
  .inputbar{flex:0 0 auto;padding:8px 24px 18px}
  .field{
    position:relative;height:104px;
    background:linear-gradient(to bottom,#fff,var(--surface));
    border:1px solid var(--lime-border);border-radius:24px;
    box-shadow:0 0 104px rgba(216,254,17,.24);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field:focus-within{box-shadow:0 0 104px rgba(216,254,17,.32),0 0 0 3px rgba(216,254,17,.25)}
  .field.error{
    border-color:var(--danger);
    box-shadow:0 0 0 3px rgba(255,92,92,.25);
    animation:fieldShake .3s ease;
  }
  @keyframes fieldShake{
    10%,90%{transform:translateX(-1px)}
    20%,80%{transform:translateX(2px)}
    30%,50%,70%{transform:translateX(-3px)}
    40%,60%{transform:translateX(3px)}
  }
  .field textarea{
    display:block;width:100%;height:100%;resize:none;background:transparent;border:none;outline:none;
    padding:15px 64px 15px 15px;
    font-family:'Inter',sans-serif;font-size:12px;line-height:18px;font-weight:500;color:var(--dark);
  }
  .field textarea::placeholder{color:var(--body)}
  .field textarea:disabled{cursor:default}
  .send{
    position:absolute;right:8px;bottom:8px;
    width:40px;height:40px;border-radius:50%;border:none;
    background:var(--dark);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .12s ease,opacity .12s ease,box-shadow .12s ease;
  }
  .send:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.22)}
  .send:active:not(:disabled){transform:scale(.93)}
  .send:focus-visible{outline:2px solid var(--dark);outline-offset:3px}
  .send:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}
  .send.sending svg{animation:pulse 1s ease-in-out infinite}
  .send svg{width:20px;height:20px}

  @media (prefers-reduced-motion:reduce){
    .row,.tags,.brief,.actions,.thinking{animation:none}
    .thinking .wave i,.thinking .dot,.send.sending svg{animation:none}
    .progress .fill{transition:none}
  }

  /* narrow: no video panel */
  @media (max-width:900px){
    .widget{grid-template-columns:1fr}
    .side{display:none}
  }
  /* mobile */
  @media (max-width:640px){
    .widget{max-height:none;border-radius:16px}
    .header{padding:max(28px, env(safe-area-inset-top)) 16px 4px;gap:8px}
    .logo.lg{width:48px;height:48px}
    .brand-name{font-size:20px;line-height:20px}
    .chat{padding:20px 16px 12px}
    .msg{max-width:84%}
    .row.user .msg{max-width:84%}
    .tags,.brief,.actions{margin-left:0}
    .tag{padding:10px 14px;font-size:13px}
    .bubble{font-size:13px;line-height:19px}
    .price{font-size:26px;line-height:28px}
    .cal-overlay-head{padding:16px}
    .cal-overlay-head h4{font-size:16px}
    .cal-overlay-head a{display:none}
    .cal-back{width:40px;height:40px}
    .inputbar{padding:4px 12px max(12px, env(safe-area-inset-bottom))}
    .field{height:88px;border-radius:20px}
    .field textarea{font-size:16px;line-height:22px} /* ≥16px avoids iOS auto-zoom on focus */
  }
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="side" aria-hidden="true">
    <video src="assets/orion.mp4" poster="assets/orion-poster.jpg" autoplay muted loop playsinline preload="metadata"></video>
  </div>

  <div class="main">
    <div class="glow top" aria-hidden="true"></div>
    <div class="glow bottom" aria-hidden="true"></div>
    <div class="progress"><div class="fill" id="progressFill"></div></div>

    <div class="header">
      <div class="logo lg"><span class="bar"></span></div>
      <div class="brand-name">Orion</div>
      <div class="brand-sub" id="brandSub">Quote Assistant ∙ ≈5-10 min</div>
    </div>

    <div class="chat" id="chat" aria-live="polite"></div>

    <div class="inputbar">
      <div class="field">
        <textarea id="input" rows="2" autocomplete="off" enterkeyhint="send" placeholder="Ask ORION anything..." aria-label="Your answer"></textarea>
        <button class="send" id="sendBtn" type="button" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 17L17 7M17 7H9M17 7V15" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="cal-overlay" id="calOverlay" aria-hidden="true">
      <div class="cal-overlay-head">
        <button class="cal-back" id="calBack" type="button" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14.7568 6L9.90713 9.99038C8.69762 10.9856 8.69762 12.8143 9.90713 13.8095L15 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <h4 id="calOverlayTitle">PICK YOUR TIME</h4>
        <a href="" target="_blank" rel="noopener" id="calOverlayOpenTab">Open in new tab ↗</a>
      </div>
      <div class="cal-overlay-body" id="cal-inline"></div>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   ALLER STUDIO — QUOTE ASSISTANT "ORION" (AI-powered)
   ─────────────────────────────────────────────────────────────
   API_ENDPOINT  → your Render proxy URL
   CAL_LINK      → your Cal.com link slug
   LEAD_ENDPOINT → proxy route that forwards leads to Make. The Make webhook itself
                   lives only on the proxy (Render env var), never in this page.
   WHATSAPP      → number for the "Write on WhatsApp" button, digits only with the
                   country code (e.g. "51999999999"). Empty = WhatsApp lets the
                   visitor pick the chat.
   ════════════════════════════════════════════════════════════ */
const CONFIG = {
  API_ENDPOINT: "https://aller-proxy.onrender.com/chat",
  CAL_LINK    : "allerstudio/intro",
  LEAD_ENDPOINT: "https://aller-proxy.onrender.com/lead",
  WHATSAPP    : "51944149072"
};
const CAL_URL = "https://cal.com/" + CONFIG.CAL_LINK;

/* ── Pricing logic (USD) ────────────────────────── */
const PRICE = {
  "ux/ui":[7000,10000], "branding":[5000,8000],
  "web development":[5000,9000], "desarrollo web":[5000,9000],
  "game ux/ui / huds":[7000,10000], "pitch deck":[2000,4000],
  "full 360":[18000,35000]
};
const BUDGET_RANGE = [ [4000,4000],[5000,10000],[10000,20000],[20000,50000],[50000,100000],[100000,200000] ];

/* ── State ──────────────────────────────────────── */
const S = {
  lang: "en",
  step: 0,
  data: { name:"", location:"", project:"", services:[], branding:"", brandingIdx:-1, product:"", competitors:"", budgetIdx:-1, budgetText:"", timeline:"", email:"" },
  messages: [],   // full conversation history for Claude
  multiSel: new Set(),
  busy: false
};
const TOTAL_STEPS = 11;

/* ── Service & budget options (bilingual) ───────── */
const OPTS = {
  services: { en:["UX/UI","Branding","Web Development","Game UX/UI / HUDS","Pitch Deck","Full 360"],
               es:["UX/UI","Branding","Desarrollo Web","Game UX/UI / HUDS","Pitch Deck","Full 360"] },
  branding:  { en:["Starting from scratch","Logo only","Full branding ready"],
               es:["Desde cero","Solo logo","Branding completo listo"] },
  budget:    { en:["Monthly Retainer $4k","$5k–$10k","$10k–$20k","$20k–$50k","$50k–$100k","+$100k"],
               es:["Retainer mensual $4k","$5k–$10k","$10k–$20k","$20k–$50k","$50k–$100k","+$100k"] },
  timeline:  { en:["ASAP (<4 weeks)","Normal (1-3 months)","Flexible (3+ months)"],
               es:["ASAP (<4 semanas)","Normal (1-3 meses)","Flexible (3+ meses)"] }
};

/* ── Fixed question flow (deterministic — never depends on the AI) ──
   STEP_FIELD: where to store a free-typed answer for the step currently
   being asked. QUESTIONS[N]: the question shown when transitioning INTO
   step N (i.e. right after the answer for step N-1 was collected).
   useAck:true means a short Claude-generated acknowledgment of the PREVIOUS
   answer is prepended — if that call fails for any reason, the question
   still gets asked exactly the same, just without the extra flourish. ── */
const STEP_FIELD = {
  0:"name", 1:"location", 2:"project", 3:"services",
  4:"branding", 5:"product", 6:"competitors", 7:"budgetText", 8:"timeline"
};

const QUESTIONS = {
  1: { en:d=>`Nice to meet you, ${d.name}! Where are you based?`,
       es:d=>`¡Un gusto, ${d.name}! ¿Desde dónde nos escribes?` },
  2: { en:d=>`Got it. What's the name of your project or company?`,
       es:d=>`Perfecto. ¿Cómo se llama tu proyecto o empresa?` },
  3: { en:d=>`What type of service are you looking for?`,
       es:d=>`¿Qué tipo de servicio buscas?`,
       tag:"services", multi:true },
  4: { en:d=>`Do you already have branding in place — logo, colors, etc.?`,
       es:d=>`¿Ya tienes identidad visual — logo, colores, etc.?`,
       tag:"branding" },
  5: { en:d=>`Tell me about ${d.project||"the project"} — what does it do, and who's it for?`,
       es:d=>`Cuéntame sobre ${d.project||"el proyecto"} — ¿qué hace y para quién es?` },
  6: { en:d=>`Who are your main competitors, or are there platforms (any industry) whose design you admire?`,
       es:d=>`¿Quiénes son tus principales competidores, o hay plataformas (de cualquier rubro) cuyo diseño admires?`,
       useAck:true },
  7: { en:d=>`What's your budget range for this project?`,
       es:d=>`¿Cuál es tu rango de presupuesto para este proyecto?`,
       tag:"budget", useAck:true },
  8: { en:d=>`What's your ideal timeline?`,
       es:d=>`¿Cuál es tu timeline ideal?`,
       tag:"timeline" },
  9: { en:d=>`Last thing — what's your email so we can send over the detailed proposal?`,
       es:d=>`Última cosa — ¿cuál es tu email para enviarte la propuesta detallada?` }
};

/* ── UI Elements ────────────────────────────────── */
const chat    = document.getElementById("chat");
const input   = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const fill    = document.getElementById("progressFill");

/* ── UI Helpers ─────────────────────────────────── */
function avatar(){ const i=document.createElement("img"); i.className="avatar"; i.src="assets/avatar.png"; i.alt=""; return i; }
function timeLabel(){
  try{ return new Date().toLocaleTimeString(S.lang==="es"?"es-PE":"en-US",{hour:"numeric",minute:"2-digit"}); }
  catch(e){ return ""; }
}
/* A message: timestamp on top, bubble below; AI messages get Orion's avatar on the left */
function messageRow(who){
  const row=document.createElement("div"); row.className="row"+(who==="user"?" user":"");
  if(who==="ai") row.appendChild(avatar());
  const msg=document.createElement("div"); msg.className="msg";
  const t=document.createElement("span"); t.className="time"; t.textContent=timeLabel();
  const b=document.createElement("div"); b.className="bubble";
  msg.appendChild(t); msg.appendChild(b); row.appendChild(msg);
  return {row,b};
}

function addAI(text){
  const {row,b}=messageRow("ai");
  // Plain text only (AI output and visitor answers are never parsed as HTML); line breaks kept
  text.split("\n").forEach((line,i)=>{ if(i) b.appendChild(document.createElement("br")); b.appendChild(document.createTextNode(line)); });
  chat.appendChild(row); scrollDown();
  S.messages.push({role:"assistant", content:text});
}

function addUser(text){
  const {row,b}=messageRow("user");
  b.textContent=text;
  chat.appendChild(row); scrollDown();
  S.messages.push({role:"user", content:text});
}

let typingRow=null;
function showTyping(){
  hideTyping();
  typingRow=document.createElement("div"); typingRow.className="thinking";
  typingRow.setAttribute("role","status");
  typingRow.innerHTML='<span class="dot"></span><span class="label"></span><span class="wave" aria-hidden="true"><i></i><i></i><i></i></span>';
  typingRow.querySelector(".label").textContent = S.lang==="es" ? "Pensando" : "Thinking";
  chat.appendChild(typingRow); scrollDown();
}
function hideTyping(){ if(typingRow){typingRow.remove();typingRow=null;} }

let tagWrap=null;
function showTags(type, multi=false, onPick){
  clearTags();
  const options = OPTS[type][S.lang] || OPTS[type]["en"];
  tagWrap=document.createElement("div"); tagWrap.className="tags";
  options.forEach(label=>{
    const el=document.createElement("button"); el.type="button"; el.className="tag"; el.textContent=label;
    el.onclick=()=>{
      if(multi){
        el.classList.toggle("selected");
        S.multiSel.has(label)?S.multiSel.delete(label):S.multiSel.add(label);
      } else { onPick(label); }
    };
    tagWrap.appendChild(el);
  });
  if(multi){
    const ok=document.createElement("button"); ok.type="button"; ok.className="tag confirm";
    ok.textContent = S.lang==="es" ? "Confirmar selección →" : "Confirm selection →";
    ok.onclick=()=>{ if(S.multiSel.size) onPick([...S.multiSel]); };
    tagWrap.appendChild(ok);
  }
  chat.appendChild(tagWrap); scrollDown();
  input.placeholder = multi
    ? (S.lang==="es" ? "Selecciona opciones y presiona enviar →" : "Tap options, then press send →")
    : (S.lang==="es" ? "Toca una opción o escribe tu respuesta..." : "Tap an option or type your answer...");
}
function clearTags(){ if(tagWrap){tagWrap.remove();tagWrap=null;} S.multiSel.clear(); input.placeholder=S.lang==="es"?"Escribe tu respuesta...":"Write your answer..."; }
function flashFieldError(){
  const f = input.closest(".field");
  if(!f) return;
  f.classList.remove("error");
  requestAnimationFrame(()=>{ f.classList.add("error"); });
  setTimeout(()=>f.classList.remove("error"), 600);
}
function scrollDown(){ requestAnimationFrame(()=>{ chat.scrollTop=chat.scrollHeight; }); }
function setProgress(){ fill.style.width=Math.min(100,(S.step/TOTAL_STEPS)*100)+"%"; }
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ── Optional AI acknowledgment ──────────────────────────────────
   Used only for flavor on the two open-text questions (product
   description, competitors). Plain text, never JSON, never controls
   step progression. Any failure → empty string → question still asks
   normally with zero personalization, nothing breaks. ── */
async function getAck(answerText){
  if(!answerText) return "";
  try{
    // The proxy builds the AI request itself (fixed model and instructions); we only send the answer
    const res = await fetch(CONFIG.API_ENDPOINT, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ lang: S.lang, answer: String(answerText).slice(0,500) })
    });
    if(!res.ok) return "";
    const data = await res.json();
    let text = String(data.text||"").trim();
    text = text.replace(/^["“'']+|["”'']+$/g,"").trim();
    if(!text || text.length>160 || /\?/.test(text)) return "";
    return text;
  }catch(e){
    console.error("getAck failed (non-fatal):", e);
    return "";
  }
}

/* ── Qualification + estimate ───────────────────── */
function parseBudgetFree(text){
  const m=text.replace(/[, ]/g,"").match(/\$?(\d+(?:\.\d+)?)(k)?/i);
  if(!m) return null;
  let v=parseFloat(m[1]); if(m[2]) v*=1000;
  return v;
}
function isMatch(){
  if(S.data.budgetIdx>=0) return true;
  const v=parseBudgetFree(S.data.budgetText||"");
  return v===null ? true : v>=5000;
}
function detectVertical(){
  const txt=(S.data.product+" "+S.data.competitors).toLowerCase();
  const map=[["fintech","Fintech"],["finance","Fintech"],["bank","Fintech"],["payment","Fintech"],["pago","Fintech"],
    ["saas","SaaS"],["software","SaaS"],["web3","Web3"],["crypto","Web3"],["blockchain","Web3"],
    ["health","Health Tech"],["salud","Health Tech"],["edtech","Edtech"],["educa","Edtech"],
    ["e-commerce","E-commerce"],["ecommerce","E-commerce"],["tienda","E-commerce"],
    ["game","Gaming"],["juego","Gaming"]];
  for(const [k,v] of map) if(txt.includes(k)) return v;
  return S.lang==="es" ? "Startup tech" : "Tech startup";
}
function estimate(){
  const full=S.data.services.some(s=>/full 360/i.test(s));
  let lo=0,hi=0;
  if(full){ [lo,hi]=PRICE["full 360"]; }
  else{
    S.data.services.forEach(s=>{
      const r=PRICE[s.toLowerCase()]||[4000,8000]; lo+=r[0]; hi+=r[1];
    });
    if(!S.data.services.length){ lo=5000; hi=12000; }
  }
  if(S.data.budgetIdx>0){
    const [blo,bhi]=BUDGET_RANGE[S.data.budgetIdx];
    const nlo=Math.max(lo,blo),nhi=Math.min(hi,bhi);
    if(nlo<nhi){ lo=nlo; hi=nhi; }
  }
  const round=v=>Math.round(v/500)*500;
  return `$${round(lo).toLocaleString("en-US")} – $${round(hi).toLocaleString("en-US")} USD`;
}

/* ── Brief card ─────────────────────────────────── */
function briefLabels(){
  const budgetStr = S.data.budgetIdx>=0 ? OPTS.budget[S.lang][S.data.budgetIdx] : (S.data.budgetText||"—");
  const brandingStr = S.data.brandingIdx>=0 ? OPTS.branding[S.lang][S.data.brandingIdx] : (S.data.branding||"—");
  return { service:S.data.services.join(" + ")||"—", budget:budgetStr, branding:brandingStr };
}
function renderBrief(){
  const match=isMatch();
  const L = S.lang==="es";
  const lbl = briefLabels();

  const card=document.createElement("div"); card.className="brief";
  const rows=[
    [L?"Contacto":"Partner", S.data.name],
    [L?"Ubicación":"Location", S.data.location],
    [L?"Proyecto":"Project", S.data.project],
    ["Vertical", detectVertical()],
    [L?"Servicio":"Service", lbl.service],
    [L?"Branding existente":"Existing branding", lbl.branding],
    [L?"Presupuesto":"Budget", lbl.budget],
    ["Timeline", S.data.timeline]
  ];
  card.innerHTML=`<h3>${L?"Brief del proyecto":"Project brief"}</h3>
    <div class="rows">${rows.map(([k,v])=>`<div class="r"><span class="k">${esc(k)}</span><span class="v">${esc(v||"—")}</span></div>`).join("")}</div>
    <div class="verdict">
      <span class="badge ${match?"":"no"}">${match?(L?"Match — Gran fit para Aller Studio":"Match — Great fit for Aller Studio"):(L?"No es fit por ahora — pero sigamos en contacto":"Not a fit right now — but let's stay in touch")}</span>
      ${match?`<div class="price">${esc(estimate())}</div>`:""}
    </div>`;
  chat.appendChild(card); scrollDown();
}

/* ── Lead capture ───────────────────────────────── */
function esc(v){ return String(v).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function buildTranscript(){
  return S.messages.map(m=>{
    const who = m.role==="assistant" ? "Aller" : "Lead";
    return `${who}: ${m.content}`;
  }).join("\n");
}
function sendLead(){
  if(!CONFIG.LEAD_ENDPOINT) return;
  const payload={...S.data, vertical:detectVertical(), match:isMatch(), estimate:isMatch()?estimate():null,
    lang:S.lang, source:"allerstudio.com quote widget", ts:new Date().toISOString(),
    transcript: buildTranscript()};
  fetch(CONFIG.LEAD_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).catch(()=>{});
}

/* ── WhatsApp hand-off ─────────────────────────────
   Opens WhatsApp with the whole brief already written, so the visitor
   only has to press send: "Hi, I'm X from Y. I want UX/UI, my budget is…" */
function whatsappMessage(){
  const L=S.lang==="es";
  const d=S.data, lbl=briefLabels();
  const cut=(v,n)=>{ v=String(v||"").trim(); return v.length>n ? v.slice(0,n-1)+"…" : v; };
  const lines=[];
  lines.push(L
    ? `Hola Aller Studio, soy ${cut(d.name,60)}${d.project?` de ${cut(d.project,80)}`:""}${d.location?` (${cut(d.location,60)})`:""}.`
    : `Hi Aller Studio, I'm ${cut(d.name,60)}${d.project?` from ${cut(d.project,80)}`:""}${d.location?` (${cut(d.location,60)})`:""}.`);
  lines.push(L
    ? `Quiero ${lbl.service}, mi presupuesto es ${lbl.budget} y mi timeline es ${d.timeline||"—"}.`
    : `I'm looking for ${lbl.service}, my budget is ${lbl.budget} and my timeline is ${d.timeline||"—"}.`);
  if(d.product) lines.push(L ? `\nMi proyecto: ${cut(d.product,400)}` : `\nMy project: ${cut(d.product,400)}`);
  if(d.competitors) lines.push(L ? `Referentes: ${cut(d.competitors,200)}` : `References: ${cut(d.competitors,200)}`);
  lines.push(`Branding: ${lbl.branding}`);
  if(isMatch()) lines.push(L ? `Estimado de Orion: ${estimate()}` : `Orion's estimate: ${estimate()}`);
  if(d.email) lines.push(`Email: ${d.email}`);
  return lines.join("\n");
}
function whatsappURL(){
  const num=String(CONFIG.WHATSAPP||"").replace(/\D/g,"");
  return `https://wa.me/${num}?text=${encodeURIComponent(whatsappMessage())}`;
}

/* ── Cal.com slide-over panel ─────────────────────
   Lives OUTSIDE the .chat scroll container as a full overlay, so the
   iframe's own scroll/wheel handling never fights with the chat's
   scroll — that's what caused the "can't scroll past the calendar" bug. */
const calOverlay = document.getElementById("calOverlay");
const calBack    = document.getElementById("calBack");
let calLoaded = false;

function openCalPanel(){
  const L=S.lang==="es";
  document.getElementById("calOverlayTitle").textContent = L?"ELIGE TU HORARIO":"PICK YOUR TIME";
  const tabLink = document.getElementById("calOverlayOpenTab");
  tabLink.href = CAL_URL;
  tabLink.textContent = L?"Abrir en pestaña nueva ↗":"Open in new tab ↗";
  calOverlay.classList.add("open");
  calOverlay.setAttribute("aria-hidden","false");
  if(!calLoaded){ initCalEmbed(); calLoaded=true; }
}
function closeCalPanel(){
  calOverlay.classList.remove("open");
  calOverlay.setAttribute("aria-hidden","true");
}
calBack.addEventListener("click", closeCalPanel);

function initCalEmbed(){
  const L=S.lang==="es";
  try{
    (function(C,A,L){let p=function(a,ar){a.q.push(ar)};let d=C.document;C.Cal=C.Cal||function(){let cal=C.Cal;let ar=arguments;if(!cal.loaded){cal.ns={};cal.q=cal.q||[];d.head.appendChild(d.createElement("script")).src=A;cal.loaded=true}if(ar[0]===L){const api=function(){p(api,arguments)};const namespace=ar[1];api.q=api.q||[];if(typeof namespace==="string"){cal.ns[namespace]=cal.ns[namespace]||api;p(cal.ns[namespace],ar);p(cal,["initNamespace",namespace])}else p(cal,ar);return}p(cal,ar)}})(window,"https://app.cal.com/embed/embed.js","init");
    Cal("init","intro",{origin:"https://app.cal.com"});
    Cal.ns["intro"]("inline",{elementOrSelector:"#cal-inline",calLink:CONFIG.CAL_LINK,config:{layout:"month_view",name:S.data.name||"",email:S.data.email||""}});
    Cal.ns["intro"]("ui",{hideEventTypeDetails:false,layout:"month_view"});
    // Cal's own success screen can end up out of view inside its iframe: confirm the booking in the chat too
    Cal.ns["intro"]("on",{action:"bookingSuccessfulV2",callback:onBooked});
    Cal.ns["intro"]("on",{action:"bookingSuccessful",callback:onBooked});
  }catch(e){
    document.getElementById("cal-inline").innerHTML=`<div style="padding:24px"><a class="cta primary" href="${CAL_URL}" target="_blank" rel="noopener">${L?"Agendar llamada ↗":"Book a call ↗"}</a></div>`;
  }
}

let bookedOnce=false;
function onBooked(e){
  if(bookedOnce) return; bookedOnce=true;
  const L=S.lang==="es";
  const data=(e&&e.detail&&e.detail.data)||{};
  const d=new Date(data.startTime||data.date||"");
  const when=isNaN(d.getTime()) ? "" : d.toLocaleString(L?"es-PE":"en-US",{weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit"});
  setTimeout(()=>{
    closeCalPanel();
    addAI(L
      ? `¡Listo, tu llamada quedó agendada${when?` para el ${when}`:""}! Te enviamos la confirmación y el link de la reunión a tu email. Nos vemos pronto.`
      : `You're all set — your call is booked${when?` for ${when}`:""}! We sent the confirmation and the meeting link to your email. Talk soon.`);
  }, 1800);
}

/* final actions: "Book a call" (re-opens the calendar panel) and "Write on WhatsApp" */
const ICON_CAL='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const ICON_WA='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a9.9 9.9 0 0 0-8.5 15l-1.4 5 5.2-1.4A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';
function addFinalActions(){
  const L=S.lang==="es";
  const wrap=document.createElement("div"); wrap.className="actions";
  const cal=document.createElement("button"); cal.type="button"; cal.className="cta primary";
  cal.innerHTML=ICON_CAL; cal.appendChild(document.createTextNode(L?"Agendar llamada":"Book a call"));
  cal.onclick=openCalPanel;
  const wa=document.createElement("a"); wa.className="cta ghost"; wa.target="_blank"; wa.rel="noopener";
  wa.innerHTML=ICON_WA; wa.appendChild(document.createTextNode(L?"Escribir por WhatsApp":"Write on WhatsApp"));
  wa.href=whatsappURL();
  wrap.appendChild(cal); wrap.appendChild(wa);
  chat.appendChild(wrap); scrollDown();
}

/* ── Step progression — always decided in JS, never by the AI ───── */
async function advanceAndAsk(prevStep, prevAnswerText){
  const nextStep = prevStep+1;
  S.step = nextStep; setProgress();

  if(nextStep===9){ input.setAttribute("inputmode","email"); input.setAttribute("autocomplete","email"); }
  else { input.setAttribute("inputmode","text"); input.setAttribute("autocomplete","off"); }

  const qDef = QUESTIONS[nextStep];
  if(!qDef) return; // shouldn't happen — step 9 is handled separately in handleMessage

  let ack = "";
  if(qDef.useAck && prevAnswerText){
    showTyping();
    ack = await getAck(prevAnswerText);
    hideTyping();
  } else {
    showTyping(); await wait(350); hideTyping();
  }

  const question = S.lang==="es" ? qDef.es(S.data) : qDef.en(S.data);
  addAI(ack ? `${ack} ${question}` : question);

  if(qDef.tag) showTagsForStep(nextStep, qDef.tag, !!qDef.multi);
}

function showTagsForStep(step, type, multi){
  showTags(type, multi, (vals)=>{
    const arr = Array.isArray(vals) ? vals : [vals];
    addUser(arr.join(", "));
    if(type==="services"){ S.data.services = arr; }
    else if(type==="branding"){ S.data.branding = arr[0]; S.data.brandingIdx = OPTS.branding[S.lang].indexOf(arr[0]); }
    else if(type==="budget"){ S.data.budgetText = arr[0]; S.data.budgetIdx = OPTS.budget[S.lang].indexOf(arr[0]); }
    else if(type==="timeline"){ S.data.timeline = arr[0]; }
    clearTags();
    handleMessage(null, true, arr.join(", "));
  });
}

/* ── Core message handler (deterministic) ─────────
   The JS always knows exactly which step we're on and what to ask
   next — Claude is never asked to track or decide flow, only (optionally)
   to phrase a short acknowledgment. This can never skip a question. ── */
async function handleMessage(userText, isTagSelection=false, ackSource=null){
  if(S.busy) return;
  S.busy=true; sendBtn.disabled=true; sendBtn.classList.add("sending"); clearTags();

  // Step 9 — email — validated locally, loops back on invalid input
  if(S.step===9){
    if(!isTagSelection){
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(userText||"")){
        addUser(userText);
        addAI(S.lang==="es"?"Ese email no parece válido — ¿lo revisas?":"That doesn't look like a valid email — mind double-checking it?");
        flashFieldError();
        S.busy=false; sendBtn.disabled=false; sendBtn.classList.remove("sending"); input.focus();
        return;
      }
      addUser(userText);
      S.data.email=userText;
    }
    await finalSequence();
    return;
  }

  let ackText = ackSource;
  if(!isTagSelection){
    addUser(userText);
    ackText = userText;
    const field = STEP_FIELD[S.step];
    if(field==="services"){
      S.data.services = (userText||"").split(",").map(s=>s.trim()).filter(Boolean);
    } else if(field==="budgetText"){
      S.data.budgetText = userText; S.data.budgetIdx = -1;
    } else if(field){
      S.data[field] = userText;
    }
  }

  await advanceAndAsk(S.step, ackText);

  S.busy=false; sendBtn.disabled=false; sendBtn.classList.remove("sending"); input.focus();
}

/* ── Final sequence ─────────────────────────────── */
async function finalSequence(){
  hideTyping();
  const L=S.lang==="es";
  const match=isMatch();

  // Summary message
  showTyping(); await wait(600); hideTyping();
  const svcStr=S.data.services.join(" + ")||(L?"diseño y desarrollo":"design and development");
  const scratch=S.data.brandingIdx===0;
  addAI(`${S.data.name}, ${L?"aquí está tu estimado para":"here's your estimate for"} ${S.data.project}. ${svcStr}${scratch?(L?" desde cero":" from scratch"):""}, ${L?"listo para lanzar.":"built to ship."}`);

  await wait(400);
  renderBrief();
  await wait(500);

  showTyping(); await wait(700); hideTyping();
  if(match){
    addAI(L?`${S.data.project} es exactamente el tipo de proyecto para el que estamos hechos. Agenda una llamada o escríbenos por WhatsApp con tu resumen ya listo, y hablamos de alcance, proceso y próximos pasos.`:`${S.data.project} is exactly the kind of project we're built for. Book a call or message us on WhatsApp with your brief ready to send, and let's talk scope, process, and next steps.`);
  } else {
    addAI(L?`Gracias por los detalles, ${S.data.name}. El presupuesto está por debajo de nuestro mínimo habitual, pero hay formas más pequeñas de empezar — como un design review enfocado o un sprint de una semana. Te escribimos a ${S.data.email} con opciones, o si prefieres, agenda una llamada o escríbenos por WhatsApp.`:`Thanks for the details, ${S.data.name}. The budget sits below our usual minimum, but there are smaller ways to start — like a focused design review or a one-week sprint. We'll reach out at ${S.data.email} with options that fit, or book a call or message us on WhatsApp if you prefer.`);
  }
  await wait(300);
  addFinalActions();

  S.step=TOTAL_STEPS; setProgress(); sendLead();
  input.disabled=true; sendBtn.disabled=true; sendBtn.classList.remove("sending");
  input.placeholder=L?"Conversación completada ✓":"Conversation complete ✓";
  S.busy=false;
}

/* ── Submit wiring ──────────────────────────────── */
function submit(){
  if(S.busy) return;
  if(S.step===3 && S.multiSel.size && !input.value.trim()){
    const vals=[...S.multiSel];
    addUser(vals.join(", ")); S.data.services=vals; clearTags();
    handleMessage(null, true, vals.join(", ")); return;
  }
  const v=input.value.trim(); input.value="";
  if(v) handleMessage(v);
}
sendBtn.addEventListener("click", submit);
// Enter sends; Shift+Enter adds a new line
input.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); submit(); } });

/* ── Language selector ──────────────────────────── */
function showLangSelector(){
  const {row,b}=messageRow("ai");
  b.textContent="👋  Hey, I'm Orion. Choose your language / Elige tu idioma";
  chat.appendChild(row);

  const tags = document.createElement("div"); tags.className="tags";

  const en = document.createElement("button"); en.type="button"; en.className="tag";
  en.textContent="🇬🇧  English";
  en.onclick=()=>{ selectLang("en"); };

  const es = document.createElement("button"); es.type="button"; es.className="tag";
  es.textContent="🇪🇸  Español";
  es.onclick=()=>{ selectLang("es"); };

  tags.appendChild(en); tags.appendChild(es);
  chat.appendChild(tags); scrollDown();
  sendBtn.disabled=true; input.disabled=true;
}

function selectLang(lang){
  S.lang = lang;
  document.documentElement.lang = lang;
  // clear language selector
  while(chat.firstChild) chat.removeChild(chat.firstChild);
  sendBtn.disabled=false; input.disabled=false;

  document.getElementById("brandSub").textContent = lang==="es"
    ? "Asistente de cotización ∙ ≈5-10 min"
    : "Quote Assistant ∙ ≈5-10 min";
  input.placeholder = lang==="es" ? "Escribe tu respuesta..." : "Write your answer...";

  addAI(lang==="es"
    ? "Hola — soy Orion, el asistente de cotización de Aller Studio. Esto toma entre 5 y 10 minutos, y al final tendrás un alcance y presupuesto estimado para tu proyecto. ¿Cómo te llamas?"
    : "Hey — I'm Orion, Aller Studio quote assistant. This takes about 5–10 minutes, and by the end you'll have an estimated scope and budget for your project. What's your name?");

  S.step=0; setProgress(); input.focus();
}

/* ── Init ───────────────────────────────────────── */
(function init(){
  setProgress();
  // The site passes its language (?lang=en|es): start right away in it; otherwise let the visitor choose
  const lang=new URLSearchParams(location.search).get("lang");
  if(lang==="en"||lang==="es") selectLang(lang);
  else showLangSelector();
})();
</script>
